[advisories]
# Deny all crates with known security vulnerabilities.
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = []

[licenses]
version = 2
# Licenses compatible with GPL-3.0 (project license).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Zlib",
    "GPL-3.0",
    "LGPL-2.1",
]
deny = []
copyleft = "warn"
allow-osi-fsf-free = "neither"
default = "deny"
confidence-threshold = 0.8

[bans]
# Deny multiple versions of the same crate — forces dependency hygiene.
multiple-versions = "warn"
wildcards = "warn"
deny = [
    # Forbid crates that write to disk or do telemetry (zero-persistence rule).
    { name = "tempfile" },
    { name = "temp-dir" },
    { name = "dirs-next" },   # use dirs crate directly if needed
]

[sources]
# Only allow crates from crates.io — no git deps or private registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

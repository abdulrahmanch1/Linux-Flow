[graph]
# This is a Linux-only project (pipewire, uinput, wayland, x11). Only evaluate
# Linux targets so Windows/macOS-only transitive deps (e.g. uds_windows, which
# pulls the banned tempfile) don't enter the graph.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

[advisories]
# Deny all crates with known security vulnerabilities.
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = []

[licenses]
version = 2
# Licenses compatible with GPL-3.0 (project license). Under licenses v2 the
# allow-list is exhaustive: any crate whose license is not listed here is
# denied. (The old deny/copyleft/allow-osi-fsf-free/default keys were removed
# in cargo-deny — that exact "deny everything not allowed" behavior is now the
# built-in default.)
allow = [
    "GPL-3.0",           # this project's own crates
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",       # icu_* (via url/idna); supersedes Unicode-DFS-2016
    "CC0-1.0",           # notify (public-domain dedication)
    "CDLA-Permissive-2.0", # webpki-roots CA bundle data
    "Unlicense",         # ksni (public domain)
]
confidence-threshold = 0.8

[bans]
# Deny multiple versions of the same crate — forces dependency hygiene.
multiple-versions = "warn"
wildcards = "warn"
deny = [
    # Forbid crates that write to disk or do telemetry (zero-persistence rule).
    { name = "tempfile" },
    { name = "temp-dir" },
    { name = "dirs-next" },   # use dirs crate directly if needed
]

[sources]
# Only allow crates from crates.io — no git deps or private registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
